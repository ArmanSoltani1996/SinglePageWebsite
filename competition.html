<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اطلاعات مسابقات — آرمان سلطانی</title>
<meta name="description" content="جدول مرحله گروهی و برنامه کامل مسابقات — نتایج، امتیازات و زمان‌بندی بازی‌ها.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#0d1117">
<link rel="icon" type="image/x-icon" href="media/tattoo-r-e.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/competition.css">
</head>
<body class="comp-page">

<header class="comp-header">
  <div class="comp-header__inner">
    <div class="comp-header__brand">
      <span class="comp-logo" aria-hidden="true">
        <img src="media/Work Logo 1.png" alt="Logo Work" />
      </span>
      <div class="comp-header__text">
        <h1 class="comp-title">مسابقات فوتسال کارگران استان فارس ۱۴۰۵</h1>
      </div>
      <span class="comp-logo" aria-hidden="true">
        <img src="media/Work Logo 2.png" alt="Logo Work" />
      </span>
    </div>
  </div>
</header>

<main class="comp-main">

  <section class="comp-section" aria-labelledby="standings-h">
    <div class="comp-section__head">
      <h2 id="standings-h" class="section__title">جدول گروه‌ها</h2>
    </div>

    <div class="tab-bar" id="groupTabs" role="tablist" aria-label="انتخاب گروه"></div>
    <div id="groupTableHost" class="group-table-host" aria-live="polite"></div>
  </section>

  <section class="comp-section" aria-labelledby="fixtures-h">
    <div class="comp-section__head">
      <h2 id="fixtures-h" class="section__title">بازی‌ها</h2>
    </div>

    <div class="tab-bar tab-bar--filter" id="fixtureFilters" role="tablist" aria-label="فیلتر بازی‌ها">
      <button class="tab-btn active" data-filter="all">همه</button>
      <button class="tab-btn" data-filter="upcoming">پیش رو</button>
      <button class="tab-btn" data-filter="played">برگزار شده</button>
    </div>

    <ul class="fixture-list" id="fixtureList" aria-live="polite"></ul>
  </section>

</main>

<footer class="comp-footer">
  <a href="index.html" class="btn btn--ghost comp-header__back">بازگشت به صفحه اصلی</a>
  <br>
  <p class="comp-footer__note">&copy; <span id="compYear"></span> آرمان سلطانی</p>
</footer>

<script src="js/competition.js"></script>
</body>
</html>
